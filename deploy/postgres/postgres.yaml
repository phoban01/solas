# One Postgres for a single-cluster run, as deploy/dynamodb-local is for
# DynamoDB. It keeps its data in an emptyDir, so the data goes with the
# Pod. The storage URL is
# postgres://postgres.solas-system.svc:5432?sslmode=disable&create-tables=true
# with PGUSER and PGPASSWORD set to solas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: solas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          args: ["-c", "fsync=off"]
          env:
            - name: POSTGRES_USER
              value: solas
            - name: POSTGRES_PASSWORD
              value: solas
            - name: POSTGRES_DB
              value: solas
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "solas"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: solas-system
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
