name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Cache Duvet
        uses: actions/cache@v6
        with:
          path: .devbox/cargo/bin/duvet
          key: duvet-${{ runner.os }}-${{ hashFiles('scripts/duvet-install.sh') }}

      - name: Install Duvet
        run: devbox run duvet-install

      - name: Restore the stamps of green checks
        uses: actions/cache/restore@v6
        with:
          path: .cache/verify
          key: verify-stamps-${{ github.run_id }}
          restore-keys: verify-stamps-

      # The Apalache verifies take 32 of the 42 minutes of a full run on
      # this runner. They run on the development VM, where the stamps
      # keep them to the models that changed; CI runs the rest.
      - name: Verify
        run: devbox run verify
        env:
          QUINT_VERIFY: "0"

      # The stamps are saved even when a check fails: each stamp marks a
      # check that passed, so the next run pays only for what failed.
      - name: Save the stamps of green checks
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/verify
          key: verify-stamps-${{ github.run_id }}
